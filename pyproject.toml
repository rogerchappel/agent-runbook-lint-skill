[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runbook-lint-skill"
version = "0.1.0"
description = "Local-first lint checks for agent automation runbooks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roger Chappel" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-runbook-lint = "agent_runbook_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

